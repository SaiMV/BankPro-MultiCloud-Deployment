; Replace these placeholder addresses before deployment.
; AWS VM should be an Ubuntu/Linux host with Docker and SSH available.
; Azure VM should be an Ubuntu/Linux host with Docker and SSH available.

[aws]
aws_vm ansible_host=AWS_PUBLIC_IP

[azure]
azure_vm ansible_host=AZURE_PUBLIC_IP

[multicloud:children]
aws
azure

[multicloud:vars]
ansible_python_interpreter=/usr/bin/python3
